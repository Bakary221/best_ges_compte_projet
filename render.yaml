services:
  - type: web
    name: best-ges-comptes
    runtime: docker
    plan: free
    buildCommand: "docker build -t best-ges-comptes ."
    startCommand: "docker run -p $PORT:80 best-ges-comptes"
    envVars:
      - key: APP_NAME
        value: BestGesComptes
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        generateValue: true
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: best-ges-comptes-db
          property: connectionString
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: file

databases:
  - name: best-ges-comptes-db
    databaseName: bestgescomptes
    user: bestgescomptes_user
    plan: free
